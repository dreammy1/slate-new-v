version: 2
updates:
  # Keep the Action versions in ci.yml / deploy.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  # PHPMailer is vendored (no composer on the host), but composer.json still
  # declares it — this surfaces security advisories even though the update is
  # applied by hand into vendor/.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    open-pull-requests-limit: 5

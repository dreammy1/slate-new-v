name: Bug report
description: Something in Slate behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Admin → …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Core, or which plugin? (studio, booking, membership, content-builder, …)
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - PHP:
        - Slate version:
        - Tenant:

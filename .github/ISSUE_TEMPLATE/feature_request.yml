name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: Does this need an ADR?
      description: Architectural changes go through docs/14-ADR first.
